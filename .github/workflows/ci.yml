name: ci

# A cada PR e a cada push na main: valida o marketplace, e valida e testa cada mod; procura segredos e dados
# pessoais. O Claude Code fica numa versão fixa, a mínima que o README promete: um teste que
# quebra aqui foi quebrado pelo PR, não por uma versão nova do Claude Code (essa é a função do canário).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CLAUDE_CODE_VERSAO: 2.1.316

jobs:
  mods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Confere as cópias do código comum
        # comum/ é a fonte única; cada mod leva uma cópia gerada (docs/adr/0002-codigo-comum-por-copia.md).
        # Falha se alguém editou comum/ ou uma cópia sem rodar `node scripts/copiar-comum.mjs`.
        run: node --test scripts/copiar-comum.test.mjs && node scripts/copiar-comum.mjs --conferir
      - name: Procura dados pessoais nos arquivos dos mods
        # Complementa o passo do job "segredos" com e-mail, id de sessão e token. O `claude plugin test` não lê
        # o disco de verdade, por isso a varredura é um teste de Node.
        run: node --test scripts/dados-pessoais.test.mjs
      - name: Instala o Claude Code na versão mínima
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSAO}" && claude --version
      - name: Valida o marketplace
        run: claude plugin validate .
      - name: Valida e testa cada mod
        # A checagem de tipos não roda aqui: o Claude Code só escreve os tipos ao carregar o mod numa sessão
        # logada, e o CI não tem login. Ela é feita por quem abre o PR (docs/requisitos.md).
        run: |
          set -euo pipefail
          for mod in plugins/*/; do
            echo "::group::${mod}"
            claude plugin validate "${mod}"
            claude plugin test "${mod}"
            echo "::endgroup::"
          done
          echo "::notice::A checagem de tipos é feita por quem abre o PR, na própria máquina (docs/requisitos.md)."

  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Procura segredos (gitleaks)
        run: docker run --rm -v "${PWD}:/repo" zricethezav/gitleaks:v8.18.4 detect --source /repo --redact --verbose
      - name: Procura dados pessoais
        # Caminho de usuário real (só /Users/exemplo vale nos testes) e id de sessão do app desktop.
        run: |
          set -uo pipefail
          achados=$(grep -rnE '/Users/[A-Za-z]|local_[0-9a-f]{8}-' --exclude-dir=.git . | grep -v '/Users/exemplo' || true)
          if [ -n "${achados}" ]; then
            echo "${achados}"
            echo "::error::dados pessoais nos arquivos acima: troque por exemplos"
            exit 1
          fi
